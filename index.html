<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>moka ♡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: #fffafd;
      background-image:
        radial-gradient(circle at 8px 8px, #ffffff 0 5px, #eadde6 6px 7px, transparent 8px),
        radial-gradient(circle at 24px 24px, #ffffff 0 5px, #eadde6 6px 7px, transparent 8px);
      background-size: 32px 32px;
      font-family: Georgia, serif;
      color: #96788a;
      text-align: center;
      padding: 35px 18px;
    }

    h1 {
      font-size: 34px;
      font-weight: normal;
      letter-spacing: 4px;
      margin: 10px 0 28px;
    }

    .photo-frame {
      width: min(90%, 430px);
      margin: auto;
      padding: 12px;
      background: #ffffff;
      border: 1px solid #e8d5df;
      box-shadow: 0 5px 20px #d9c3d455;
    }

    .photo-frame img {
      display: block;
      width: 100%;
      height: auto;
    }

    .decoration {
      margin-top: 25px;
      letter-spacing: 8px;
      color: #c5a6b7;
    }
  </style>
</head>

<body>

  <h1>moka ♡</h1>

  <div class="photo-frame">
    <img src="photo.JPG" alt="moka">
  </div>

  <div class="decoration">♡ · ♡ · ♡ · ♡ · ♡</div>

</body>
</html>
